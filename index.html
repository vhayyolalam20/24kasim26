<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sevgili Öznur Hocama</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#fffaf0,#f4e3e4);color:#69434b;font-family:Georgia,serif;padding:24px;text-align:center}.wrap{width:min(100%,540px)}.flower{font-size:42px;color:#b77c88;letter-spacing:12px}h1{font-weight:normal;font-size:36px}button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}.envelope{position:relative;display:grid;place-items:center;width:min(290px,78vw);height:184px;margin:30px auto;background:#ead1c9;border-radius:5px;box-shadow:0 12px 35px #8f59652b;overflow:hidden}.envelope:before{content:'';position:absolute;inset:0;background:#f7e7db;clip-path:polygon(0 0,100% 0,50% 62%)}.seal{z-index:1;background:#a35d70;color:white;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;font-size:24px;margin-top:35px}.hint{font-size:15px;color:#805c63}.letter{display:none;background:#fffdf6;padding:35px 24px;border:1px solid #d4b9a1;box-shadow:0 12px 40px #8f59651c;outline:1px solid #e5d1bc;outline-offset:-9px}.letter p{font-size:clamp(18px,4vw,23px);line-height:1.65;opacity:0;animation:appear 1.2s ease forwards}.letter p:nth-of-type(2){animation-delay:1s}.letter p:nth-of-type(3){animation-delay:2s}.letter footer{animation:appear 1.2s 3s both;font-size:15px;line-height:1.8}.opened .intro{display:none}.opened .letter{display:block;animation:appear .8s both}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}</style></head><body><main class="wrap" id="card"><section class="intro"><div class="flower">❀ ❁ ❀</div><h1>Sevgili Hocama…</h1><button aria-label="Mektubu aç" onclick="document.getElementById('card').classList.add('opened');document.getElementById('letter').focus()"><span class="envelope"><span class="seal">♥</span></span><span class="hint">Size özel bir mektup · Açmak için dokunun</span></button></section><section class="letter" id="letter" tabindex="-1"><div class="flower">❀ ❁ ❀</div><p>Bugün öğrencilerime kattığım her güzellikte sizin de emeğiniz var hocam…</p><p>Bir öğrenciniz olarak değil, artık sizin yetiştirdiğiniz bir öğretmen olarak da Öğretmenler Gününüzü kutluyorum.</p><p><em>Sevgi, saygı ve minnetle…</em></p><footer>Vahideh Hayyolalam<br>24 Kasım 2026</footer></section></main></body></html>
